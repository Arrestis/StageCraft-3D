[package]
name = "stagecraft_3d"
version = "0.4.0"
edition = "2021"
description = "Plan and preview theatre sets in 3D inside real venue presets"
repository = "https://github.com/Arrestis/StageCraft-3D"
readme = "README.md"
license = "GPL-3.0-only"
build = "build.rs"

[[bin]]
name = "stagecraft_3d"
path = "src/main.rs"

[dependencies]
# Base features work everywhere (OpenGL). "modern" adds DirectX 12 / Vulkan / Metal, the
# accessibility bridge and system fonts; the Windows 7/8 builds leave it out.
eframe = { version = "0.37", default-features = false, features = ["glow", "clipboard", "default_fonts", "links", "wayland", "x11"] }
winit = "0.30"
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"

[features]
default = ["modern"]
modern = ["eframe/wgpu", "eframe/accesskit", "eframe/system_fonts", "eframe/web_screen_reader"]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
strip = true

[profile.dev]
opt-level = 2

# eframe with a one-line Windows 7 fix (see vendor/eframe/STAGECRAFT-PATCH.md).
[patch.crates-io]
eframe = { path = "vendor/eframe" }
rfd = { path = "vendor/rfd" }
